name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full gate: typecheck -> vitest -> tsup build -> Storybook build.
      - name: Validate
        run: pnpm validate

      # The nucleux.in/mcp bridge (sign-in, tokens, OAuth). It installs
      # @nucleux/mcp from a vendored tarball that is not in git, so fetch it first.
      - name: Hosted MCP server tests
        working-directory: services/mcp-http
        run: |
          v=$(node -p 'require("./package.json").dependencies["@nucleux/mcp"].match(/mcp-(.+)\.tgz/)[1]')
          mkdir -p vendor && (cd vendor && npm pack "@nucleux/mcp@$v")
          npm ci
          npm test
